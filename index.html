<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="Plataforma Integrada de Gestão de Chamados e Suporte TI - CRQ-12" />
  <meta name="theme-color" content="#168ac0" />
  <link rel="icon" href="/favicon-neon.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/crq12-logo.jpg" />
  <title>CRQ-12 Chamados</title>
  <link rel="dns-prefetch" href="https://qrjhqdhjcueeexusthsg.supabase.co" />
  <script>
    try {
      var theme = localStorage.getItem("crq-theme") || "light";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    } catch (error) {}
  </script>
  <style>
    .boot-screen {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #10233f;
      background: #eef8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    .boot-card {
      display: grid;
      gap: 14px;
      width: min(360px, 100%);
      justify-items: center;
      text-align: center;
    }

    .boot-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      object-fit: contain;
      background: #fff;
      box-shadow: 0 10px 26px rgba(16, 86, 145, 0.12);
    }

    .boot-card strong {
      font-size: 1rem;
    }

    .boot-card span {
      color: #49657f;
      font-size: 0.88rem;
    }

    .boot-progress {
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(14, 126, 193, 0.12);
    }

    .boot-progress::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #0e8fd3;
      animation: boot-progress 1.1s ease-in-out infinite;
    }

    html[data-theme="dark"] .boot-screen {
      color: #f5f8ff;
      background: #0d1522;
    }

    html[data-theme="dark"] .boot-card span {
      color: #a8b7cc;
    }

    html[data-theme="dark"] .boot-progress {
      background: rgba(125, 211, 252, 0.12);
    }

    html[data-theme="dark"] .boot-progress::after {
      background: #38bdf8;
    }

    @keyframes boot-progress {
      0% { transform: translateX(-115%); }
      100% { transform: translateX(255%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-progress::after {
        width: 100%;
        opacity: 0.45;
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <main class="boot-screen" aria-live="polite" aria-busy="true">
      <section class="boot-card" aria-label="Carregando sistema">
        <img class="boot-logo" src="/crq12-logo.jpg" alt="CRQ-12" decoding="async" />
        <strong>Carregando Central de Atendimento TIC</strong>
        <span>Preparando sessão e chamados...</span>
        <div class="boot-progress" aria-hidden="true"></div>
      </section>
    </main>
  </div>
  


  <script type="module" src="/src/main.ts"></script>
</body>

</html>
